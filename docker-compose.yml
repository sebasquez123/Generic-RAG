services:
  # PostgreSQL with pgvector extension
  db:
    container_name: genrag_pgvector_db
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genrag_network

  # NestJS API Service
  api:
    container_name: genrag_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"
    # Every key from .env reaches the container, so it never drifts from the
    # required keys validated against .env.example in src/config.ts.
    env_file:
      - .env
    environment:
      # Container-to-container traffic uses the service name and internal Postgres port.
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - genrag_network

volumes:
  postgres_data:
    driver: local

networks:
  genrag_network:
    name: genrag_network
    driver: bridge
